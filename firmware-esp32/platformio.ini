[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep+
extra_scripts = pre:../tools/sdk_compat.py
lib_deps =
  EEPROM
  FS
  LittleFS
  SPIFFS
  WiFiClientSecure
  PerfectaCommunication=symlink://../komunikacja-perfecta
  PerfectaSuplaIntegration=symlink://../integracja-supla
  https://github.com/SUPLA/supla-device.git#459fc92ae9803286cc14113ba96f582fab8a9dee
build_unflags = -std=gnu++11
build_flags =
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0
  -std=gnu++17
  -Iinclude
  -I../komunikacja-perfecta/include
  -I../integracja-supla/include
